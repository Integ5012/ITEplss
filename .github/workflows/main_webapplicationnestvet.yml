# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# Monorepo: API lives in backend/ (root has no package.json).

name: Build and deploy Node.js app to Azure Web App - WebApplicationNestVet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm install (backend)
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "WebApplicationNestVet"
          slot-name: "Production"
          # Artifact is backend/ contents at root (see upload path backend/)
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_35BF5114B4F54FC09EDCE9A38E9DC0E1 }}
